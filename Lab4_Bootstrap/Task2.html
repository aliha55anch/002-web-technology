<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Responsive Bootstrap-based Registration Page</title>
</head>
<body>
    <div class="container mt-3">
        <div class="text-center p-3 bg-light text-dark">
            <h2>Training Institute</h2>
            <p>Lorem ipsum dolor sit amet.</p>
        </div>
        <div class="row mt-4">
            <div class="col-lg-7">
                <h3>Registration</h3>
                <form>
                    <div class="mb-2">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">City</label>
                        <input type="text" class="form-control">
                    </div>
                    <h5>Skills</h5>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox">
                        <label class="form-check-label">HTML</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox">
                        <label class="form-check-label">CSS</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" disabled>
                        <label class="form-check-label">Bootstrap</label>
                    </div>
                    <button type="button" class="btn btn-dark">Submit</button>
                </form>
            </div>
            <div class="col-lg-5 text-center mt-4">
                <img src="/numl-seeklogo.png" alt="Logo" height="30" class="d-inline-block align-text-top">
                <h4 class="mt-3">About Institute</h4>
                <p>
                    NUML Islamabad
                </p>
                <ul class="nav nav-tabs justify-content-center">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Overview</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Courses</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
                <button type="button" class="btn btn-dark mt-3">
                    Read More
                </button>
            </div>
        </div>
        <div class="mt-4">
            <h3>Courses and Fees</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Fee</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>HTML</td>
                        <td>5000</td>
                    </tr>
                    <tr>
                        <td>CSS</td>
                        <td>6000</td>
                    </tr>
                    <tr>
                        <td>Bootstrap</td>
                        <td>7000</td>
                    </tr>
                    <tr>
                        <td>PHP</td>
                        <td>10000</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
