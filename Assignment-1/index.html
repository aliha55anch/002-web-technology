<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Racer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🏎️ SPEED RACER 🏎️</h1>
    <p>Avoid the traffic and survive!</p>
    <div class="score">
        <span>Score: 200</span>&emsp;
        <span>Speed: 70 km/h</span>&emsp;
        <span>Level: 2</span>
    </div>


    <div class="container">
        <div class="road">

            <div class="line line1"></div>
            <div class="line line2"></div>

            <img class="car1" src="/10382282.png" alt="car1" height="100px" width="100px">
            <img class="car2" src="/10382555.png" alt="car2" height="100px" width="100px">
            <img class="car3" src="/10382282.png" alt="car3" height="100px" width="100px">

        </div>
    </div>
    <p>Avoid the cars!</p>
    <p><strong>⬅️ Left </strong> &nbsp; <strong> Right ➡️ </strong> </p>
    <button class="start">START RACE</button>

</body>

</html>
