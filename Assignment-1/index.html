<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Car Racing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>MINI CAR RACING GAME</h1>

    <div class="score">
        <span>Score: 200</span>
        <span>Speed: 70 km/h</span>
        <span>Level: 2</span>
    </div>


    <div class="game">
        <div class="road">
            <div class="roadLine1"></div>
            <div class="roadLine2"></div>
            <div class="roadLine3"></div>
            <div class="roadLine4"></div>
            <div class="roadLine5"></div>

            <div class="enemy1">
                <div class="window"></div>
            </div>
            <div class="enemy2">
                <div class="window"></div>
            </div>
            <div class="enemy3">
                <div class="window"></div>
            </div>
            <div class="player">
                <div class="window"></div>
            </div>
        </div>
    </div>
    <button class="start">START RACE</button>
    <p>Drive carefully</p>

</body>

</html>
