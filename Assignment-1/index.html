<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Car Racing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>MINI CAR RACING GAME</h1>

    <div class="score">
        <span>Score: 200</span>
        <span>Speed: 70 km/h</span>
        <span>Level: 2</span>
    </div>


    <div class="container">
        <div class="road">

            <div class="line line1"></div>
            <div class="line line2"></div>

            <img class="car1" src="/10382282.png" alt="car1" height="100px" width="100xp">
            <img class="car2" src="/10382555.png" alt="car2" height="100px" width="100xp">
            <img class="car3" src="/10382282.png" alt="car3" height="100px" width="100xp">

        </div>
    </div>
    <button class="start">START RACE</button>
    <p>Drive carefully</p>

</body>

</html>
